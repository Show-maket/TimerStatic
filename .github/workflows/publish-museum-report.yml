name: Publish museum report

on:
  push:
    branches:
      - museum-report-live
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: museum-report-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out report
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload report
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy report
        id: deployment
        uses: actions/deploy-pages@v4
