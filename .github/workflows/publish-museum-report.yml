name: Publish museum report

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: museum-report-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Load report files
        uses: actions/checkout@v4
        with:
          ref: museum-report-august-2026

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
